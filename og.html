<!doctype html>
<!-- The Open Graph card, 1200 × 630. `npm run og` renders it to public/og.jpg. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SpacesBar card</title>
  </head>
  <body class="og">
    <header class="menubar og-bar">
      <span class="mb-app"><span class="mb-glyph"></span>SpacesBar</span>
      <div class="mb-status">
        <span class="mb-icon is-active" id="status-icon">
          <svg viewBox="0 0 20 20"><g fill="currentColor"><rect x="2" y="7.67" width="1.56" height="4.65" rx=".78"/><rect x="4.89" y="4.19" width="1.56" height="11.62" rx=".78"/><rect x="7.78" y="1.06" width="1.56" height="17.88" rx=".78"/><rect x="10.66" y="5.31" width="1.56" height="9.39" rx=".78"/><rect x="13.55" y="2.89" width="1.56" height="14.22" rx=".78"/><rect x="16.44" y="6.88" width="1.56" height="6.24" rx=".78"/></g></svg>
        </span>
        <span class="mb-sys mb-battery"><i></i></span>
        <span class="mb-clock">Fri 9:41 PM</span>
      </div>
    </header>
    <div class="rings og-rings"><i></i><i></i><i></i><i></i></div>
    <section class="og-copy">
      <img class="og-icon" src="/icon.svg" alt="" />
      <h1>SpacesBar</h1>
      <p>X Spaces in the macOS menu bar.</p>
      <div class="tags"><span>free</span><span>native</span><span>macOS 14+</span><span>Rust + SwiftUI</span></div>
    </section>
    <div class="og-room" id="room-panel"></div>
    <script type="module" src="/src/og.ts"></script>
  </body>
</html>
