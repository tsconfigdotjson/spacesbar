<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 96 832 832">
  <!-- The SpacesBar icon: the menu bar glyph on a violet tile, on
       Apple's macOS grid (an 824 pt tile on a 1024 canvas). Rendered to
       AppIcon.icns by design/render.mjs; the site uses it as is. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#a68cff"/>
      <stop offset="0.5" stop-color="#7d5cff"/>
      <stop offset="1" stop-color="#4521c2"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.9" cy="1" r="0.75">
      <stop offset="0" stop-color="#ff7ad1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7ad1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.25" cy="0" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e9e2ff"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="barShadow" x="-50%" y="-20%" width="200%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2a0c8a" flood-opacity="0.5"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#warm)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="4"/>
  <!-- SF Symbols' "waveform" (semibold), the menu bar icon: its six bars
       measured from the symbol and redrawn as rounded rects. -->
  <g fill="url(#bar)" filter="url(#barShadow)">
    <rect x="280.2" y="444.6" width="45.1" height="134.8" rx="22.5"/>
    <rect x="364.0" y="343.7" width="45.1" height="336.6" rx="22.5"/>
    <rect x="447.8" y="253.0" width="45.1" height="517.9" rx="22.5"/>
    <rect x="531.1" y="376.0" width="45.1" height="271.9" rx="22.5"/>
    <rect x="614.9" y="306.0" width="45.1" height="412.1" rx="22.5"/>
    <rect x="698.7" y="421.6" width="45.1" height="180.8" rx="22.5"/>
  </g>
</svg>
