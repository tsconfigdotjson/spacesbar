name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The download is served from Pages, under a stable name: the latest
      # release's disk image (releases are published here; the app's source is private).
      - name: Add the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'SpacesBar-*.dmg' --output dist/SpacesBar.dmg
          else
            echo "::warning::No release yet; the Download link will 404."
          fi
      - name: Build the appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/appcast.mjs > dist/appcast.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
